version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: ./event_voting_bot
    env_file:
      - .env
    depends_on:
      - db
    restart: always
    volumes:
      - ./event_voting_bot:/app

volumes:
  pgdata: 